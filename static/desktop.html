<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALCI · Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 24'%3E%3Cpath d='M10 1C10 1 2 10 2 15a8 8 0 0 0 16 0C18 10 10 1 10 1z' fill='%230A7C8A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/fonts.css">
<style>
:root{--paper:#F6FAFB;--surface:#fff;--ink:#10283A;--muted:#566F7E;--line:#D5E2E8;--lagoon:#0A7C8A;--amber:#A86F00;--coral:#C93C26;--tint:#28A8D6;
 --display:"Unbounded",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0E2230;--surface:#15323F;--ink:#E6F1F4;--muted:#94B1BE;--line:#27495B;--lagoon:#4FC3CD;--amber:#F0B73A;--coral:#F2806A}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:color-mix(in srgb,var(--tint) 9%,var(--paper));color:var(--ink);font:16px/1.55 var(--body);min-height:100vh;transition:background .6s}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.15;letter-spacing:-.02em}
h2{font-size:1.35rem}h3{font-size:1rem;font-weight:500}
.muted{color:var(--muted)}a{color:var(--lagoon)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
/* top bar */
.bar{display:flex;align-items:center;gap:28px;padding:22px 0}
.brand{font:700 1.5rem var(--display);letter-spacing:-.03em}
.dev{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:4px;margin-left:auto;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:4px;border-radius:999px}
.tab{all:unset;cursor:pointer;padding:8px 18px;border-radius:999px;font-weight:500;font-size:.95rem;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--ink);color:var(--paper)}
.who{font-size:.9rem;color:var(--muted);display:flex;gap:14px;align-items:center}
.who i{width:9px;height:9px;border-radius:50%;background:var(--lagoon);display:inline-block;margin-right:6px}
.who i.off{background:var(--coral)}
.who button{all:unset;cursor:pointer;text-decoration:underline}
main{padding:8px 0 80px}
section[hidden]{display:none}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:44px 56px 44px 60px;border-radius:44px;background:color-mix(in srgb,var(--tint) 28%,var(--surface))}
.score{font:700 clamp(4.6rem,9vw,8.2rem)/.9 var(--display);letter-spacing:-.06em}
.score small{font:500 1.3rem var(--display);letter-spacing:0;color:var(--muted);margin-left:.4rem}
.hero h1{font-family:var(--body);font-weight:600;font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.2;letter-spacing:-.015em;max-width:24ch;margin:22px 0 10px}
.hero p{margin:0 0 20px;color:var(--muted)}
.hero .gota{display:block}
/* ph strip */
.phwrap{margin:44px 0 12px}
.phstrip{position:relative;height:22px;border-radius:11px}
.phstrip i{position:absolute;top:-12px;height:34px;border-left:3px solid var(--ink);transform:translateX(-1.5px)}
.phstrip i b{position:absolute;top:-28px;left:-22px;width:44px;text-align:center;font:500 .85rem var(--display);background:var(--ink);color:var(--paper);border-radius:8px;padding:2px 0}
.phticks{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:.85rem;color:var(--muted);margin-top:6px}.phticks span:nth-child(2){text-align:center}.phticks span:last-child{text-align:right}
/* readings */
.readings{margin-top:30px}
.rd{display:grid;grid-template-columns:190px 230px 170px 1fr;gap:20px;align-items:center;padding:20px 4px;border-bottom:1px solid var(--line)}
.rd:first-child{border-top:1px solid var(--line)}
.rd .n{font-weight:600}.rd .n span{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.rd .v{font:500 1.9rem var(--display);letter-spacing:-.03em}.rd .v small{font-size:.8rem;color:var(--muted);letter-spacing:0}
.tag{font-weight:600;display:flex;align-items:center;gap:8px}.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.tag.good{color:var(--lagoon)}.tag.ok{color:var(--amber)}.tag.bad{color:var(--coral)}
.spark{width:150px;height:40px}.sl{fill:none;stroke:var(--lagoon);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.sd{fill:var(--ink)}.dash{stroke-dasharray:3 5;opacity:.45}
/* story */
.story{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;margin-top:56px;align-items:start}
.story>div:first-child{padding-top:30px}.story .summary{font-size:1.12rem;max-width:58ch;margin:14px 0 18px}
.story ul.issues{padding-left:1.1rem;margin:0}.story ul.issues li{margin:.4rem 0}
.todo{background:color-mix(in srgb,var(--tint) 16%,var(--surface));border-radius:32px;padding:30px 32px}
.todo ul{list-style:none;padding:0;margin:16px 0 0}
.todo li{position:relative;padding:14px 0 14px 38px;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.todo li:first-child{border-top:0}
.todo li::before{content:"";position:absolute;left:0;top:17px;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.todo .src{margin-top:18px;font-size:.9rem}.todo .src ul{margin:6px 0 0}.todo .src li{padding:2px 0;border:0}.todo .src li::before{display:none}.todo .src li{padding-left:0}
.fine{margin-top:40px;font-size:.88rem;color:var(--muted);max-width:80ch}
/* controls */
.btn{font:600 .95rem var(--body);background:var(--lagoon);color:#fff;border:0;border-radius:999px;padding:11px 22px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.warn{background:var(--coral)}
.btn:disabled{opacity:.5;cursor:wait}
input,select{font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
/* history */
.plots{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0 36px}
.plot{background:var(--surface);border-radius:24px;padding:22px 22px 14px}
.plot h3{margin-bottom:8px}
.chart{width:100%;height:auto}.chart text{font-size:15px;fill:var(--muted)}.chart .band{fill:var(--lagoon);opacity:.13}.chart .line{stroke:var(--lagoon)}.chart .dot{fill:var(--ink)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:.9rem}
/* settings layout */
.sec{display:grid;grid-template-columns:260px 1fr;gap:40px;padding:34px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec h3{font-size:1.1rem}.sec .d{color:var(--muted);font-size:.92rem;margin-top:6px}
.steps{display:grid;gap:12px;margin-bottom:18px}
.step{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.step b{min-width:9ch;font-weight:600}
.step .ok{color:var(--lagoon);font-weight:600}
pre{background:var(--ink);color:var(--paper);padding:14px;border-radius:14px;overflow:auto;max-height:260px;font-size:.82rem;white-space:pre-wrap}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--paper);padding:14px 20px;border-radius:16px;max-width:380px;display:none;z-index:50}
.banner{background:color-mix(in srgb,var(--amber) 20%,var(--surface));padding:12px 18px;border-radius:16px;margin-bottom:20px}
.empty{padding:60px 0;max-width:46ch}.empty h2{margin-bottom:12px}
@media(max-width:900px){.wrap{padding:0 18px}.bar{flex-wrap:wrap;gap:14px}.tabs{margin-left:0;order:3;width:100%;overflow-x:auto}.hero{grid-template-columns:1fr;padding:32px 28px}.hero .gota{margin:0 auto;order:-1;width:190px;height:auto}.story,.plots,.sec{grid-template-columns:1fr;gap:24px}.rd{grid-template-columns:1fr 1fr;gap:8px 16px}.rd .spark{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <header class="bar">
  <span class="brand">ALCI</span><span class="dev" id="dev"></span>
  <nav class="tabs" role="tablist" aria-label="Secciones">
   <button class="tab" role="tab" data-t="resumen" aria-selected="true">Resumen</button>
   <button class="tab" role="tab" data-t="historial" aria-selected="false">Historial</button>
   <button class="tab" role="tab" data-t="patrones" aria-selected="false">Patrones</button>
   <button class="tab" role="tab" data-t="dispositivo" aria-selected="false">Dispositivo</button>
  </nav>
  <div class="who"><span><i id="dot"></i><span id="mod"></span></span><button id="out" hidden>Cerrar sesión</button></div>
 </header>
 <main>
  <section id="resumen"></section>
  <section id="historial" hidden></section>
  <section id="patrones" hidden></section>
  <section id="dispositivo" hidden></section>
 </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// muestra en pantalla cualquier fallo de carga o de script, para poder diagnosticar sin consola
(function () {
  function show(m) { var d = document.createElement("div"); d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#C8452B;color:#fff;padding:10px 14px;font:14px system-ui"; d.textContent = "Error en la página: " + m; (document.body || document.documentElement).appendChild(d); }
  addEventListener("error", function (e) { show(e.message || ("no se pudo cargar " + ((e.target && (e.target.src || e.target.href)) || "un archivo"))); }, true);
  addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || e.reason); });
})();
</script>
<script src="/static/common.js?v=3"></script>
<script>
let S = null, tab = "resumen", hist = 7;
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 5000); };
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };

function showTab(t) {
  tab = t;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.t === t));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== t);
  render();
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.t));
$("#out").onclick = guard(async () => { await api("/logout", {}); S.admin = false; render(); });

async function refresh() { S = await api("/status"); render(); }

function jobBox(name) {
  const j = S.jobs[name]; if (!j) return "";
  return `<pre aria-live="polite">${esc(j.state === "running" ? "En curso…\n" : j.state === "error" ? "Falló:\n" : "")}${esc(j.log)}</pre>`;
}

async function renderResumen() {
  const L = S.latest, a = L?.analysis, run = S.jobs.measure?.state === "running", busy = ["measure", "clean"].some(n => S.jobs[n]?.state === "running"), cleanBtn = `<button class="btn alt" id="clean" ${busy ? "disabled" : ""}>${S.jobs.clean?.state === "running" ? "Limpiando…" : "Limpieza"}</button>`;
  if (!L) return `<div class="empty"><h2>Aún no hay mediciones</h2><p class="muted">Cuando el equipo analice la primera muestra, aquí verás cómo está el agua.</p><button class="btn" id="mnow" ${busy ? "disabled" : ""}>${run ? "Midiendo…" : "Medir ahora"}</button>${cleanBtn}${jobBox("measure")}</div>`;
  const rows = (await api("/history?days=7")).rows;
  const [t] = tier(L.score), stale = S.auto && S.now - L.ts > S.interval_min * 120;
  const rd = [["Acidez", "ph", L.ph, words.ph(L.ph), L.ph == null ? "—" : L.ph.toFixed(2), L.ph_cal ? "calibrada" : "sin calibrar"],
    ["Claridad", "ntu", L.ntu, words.ntu(L.ntu), L.ntu == null ? "—" : L.ntu.toFixed(0) + " <small>NTU</small>", "turbidez"],
    ["Temperatura", "temp", L.temp, words.temp(L.temp), L.temp == null ? "—" : L.temp.toFixed(1) + " <small>°C</small>", "del agua"]];
  return `${stale ? `<div class="banner">La última medición es ${ago(L.ts, S.now)}. Revisa que el equipo esté encendido.</div>` : ""}
   <div class="hero"><div>
     <div class="score">${L.score}<small>/100</small></div>
     <h1>${esc(a?.headline || t)}</h1>
     <p>Medido ${ago(L.ts, S.now)}</p>
     <button class="btn" id="mnow" ${busy ? "disabled" : ""}>${run ? "Midiendo…" : "Medir ahora"}</button>${cleanBtn}
    </div>${drop(L.score, 250)}</div>
   ${run ? jobBox("measure") : ""}${S.jobs.clean?.state === "running" || S.jobs.clean?.state === "error" ? jobBox("clean") : ""}
   <div class="phwrap">${phStrip(L.ph)}</div>
   <div class="readings">${rd.map(([n, k, , [w, tone], v, note]) => `<div class="rd"><div class="n">${n}<span>${note}</span></div><div class="v">${v}</div>${spark(rows, k, SPARK[k])}<div class="tag ${tone}">${w}</div></div>`).join("")}</div>
   ${a ? `<div class="story"><div><h2>Qué le pasa al agua</h2><p class="summary">${esc(a.summary)}</p>
      ${a.issues?.length ? `<ul class="issues">${a.issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}</div>
     <div class="todo"><h2>Qué hacer</h2>${a.actions?.length ? `<ul>${actionsList(a.actions)}</ul>` : `<p class="muted">Nada por ahora.</p>`}
      ${a.sources?.length ? `<div class="src"><strong>Fuentes consultadas</strong><ul>${sourcesList(a.sources)}</ul></div>` : ""}</div></div>
     <p class="fine">Solo medimos pH, turbidez y temperatura: no detectamos cloro, metales ni bacterias, así que este informe no dice si el agua es potable. Generado por ${esc(a.model)}.${a.llm_error ? " El modelo local no respondió; se muestran reglas básicas." : ""}</p>`
    : `<p class="muted" style="margin-top:40px">El análisis del modelo aún se está generando.</p>`}`;
}

async function renderHistorial() {
  const h = await api("/history?days=" + hist);
  return `<h2 style="margin-top:12px">Historial</h2><p><select id="rng" aria-label="Periodo">${[[1, "Último día"], [7, "7 días"], [30, "30 días"], [365, "Un año"]].map(([d, l]) => `<option value="${d}" ${d == hist ? "selected" : ""}>${l}</option>`).join("")}</select></p>
   <div class="plots">${CHARTS.map(([k, t, o]) => `<div class="plot"><h3>${t}</h3>${chart(h.rows, k, o)}</div>`).join("")}</div>
   <table><tr><th>Fecha</th><th>pH</th><th>NTU</th><th>°C</th><th>Puntaje</th></tr>${h.rows.slice(-30).reverse().map(r => `<tr><td>${dayfmt(r.ts)}</td><td>${r.ph?.toFixed(2) ?? "—"}</td><td>${r.ntu?.toFixed(0) ?? "—"}</td><td>${r.temp?.toFixed(1) ?? "—"}</td><td>${Math.round(r.score)}</td></tr>`).join("")}</table>`;
}

async function renderPatrones() {
  const [h, adv] = await Promise.all([api("/history?days=30"), api("/advice")]);
  return `<h2 style="margin-top:12px">Patrones de los últimos 30 días</h2>
   ${h.patterns.length ? `<ul>${h.patterns.map(p => `<li><strong>${esc(p.issue)}</strong> en ${p.share}% de las muestras</li>`).join("")}</ul>` : `<p class="muted">No hay problemas que se repitan${h.rows.length < 3 ? " (faltan mediciones: se necesitan al menos 3)" : ""}.</p>`}
   <h2 style="margin-top:44px">Consejos anteriores</h2>
   ${adv.map(x => `<div class="sec"><div><h3>${esc(x.analysis.headline)}</h3><p class="d">${dayfmt(x.ts)}, puntaje ${x.score}</p></div><div><p style="margin-top:0">${esc(x.analysis.summary)}</p>${x.analysis.actions?.length ? `<div class="todo"><ul>${actionsList(x.analysis.actions)}</ul></div>` : ""}</div></div>`).join("") || `<p class="muted">Todavía no hay consejos.</p>`}`;
}

const BUF = [4.0, 6.86, 9.18];
let calPts = [], sys = null;
async function renderDispositivo() {
  if (!S.admin) return `<div class="empty"><h2>Dispositivo</h2><p class="muted">Estas opciones cambian el equipo. Entra con la contraseña de administrador (está en <code>data/ADMIN_PASSWORD.txt</code> dentro de la Pi).</p>
    <form id="login"><input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" required> <button class="btn">Entrar</button></form></div>`;
  sys = await api("/system");
  const c = S.calibration, tc = S.turb_calibration, up = sys.last_update;
  return `<div style="margin-top:12px"></div>
  <div class="sec"><div><h3>Calibrar pH</h3><p class="d">${c ? `Calibrado ${ago(c.ts, S.now)}, error máximo ${c.max_err.toFixed(2)} pH.` : "Sin calibrar: el pH es aproximado."} Enjuaga la sonda con agua destilada entre soluciones.</p></div>
   <div><div class="steps">${BUF.map(b => { const p = calPts.find(x => x.buffer === b); return `<div class="step"><b>pH ${b.toFixed(2)}</b><button class="btn alt" data-cap="${b}">Medir solución</button><span class="ok">${p ? "Medida: " + p.v.toFixed(3) + " V" : ""}</span></div>`; }).join("")}</div>
   <div class="row-actions"><button class="btn" id="calok" ${calPts.length < 2 ? "disabled" : ""}>Guardar calibración</button><button class="btn alt" id="calreset">Borrar calibración</button></div>
   <p class="muted">Cada medición dura unos 10 segundos. Con dos soluciones basta; con tres queda más precisa.</p></div></div>
  <div class="sec"><div><h3>Calibrar turbidez</h3><p class="d">${tc ? `Calibrada ${ago(tc.ts, S.now)} con agua limpia a ${tc.v_clear.toFixed(2)} V.` : "Sin calibrar: la turbidez es aproximada."}</p></div>
   <div><p style="margin-top:0">Limpia el sensor, sumérgelo por completo en agua limpia, sin burbujas ni movimiento, y mide.</p>
   <div class="row-actions"><button class="btn" id="tcap">Medir agua limpia</button><button class="btn alt" id="treset">Borrar calibración</button></div>
   <p class="muted">El agua limpia queda como 0 NTU. Los valores altos son relativos a esa referencia, no un análisis de laboratorio.</p></div></div>
  <div class="sec"><div><h3>Mediciones</h3><p class="d">Bombas: ${S.pumps ? "activadas" : "desactivadas (sin conectar)"}.</p></div>
   <div><p style="margin-top:0"><label><input type="checkbox" id="auto" ${S.auto ? "checked" : ""}> Medir automáticamente</label></p>
   <p><label>Medir cada <select id="intv" ${S.auto ? "" : "disabled"}>${[[60, "1 hora"], [180, "3 horas"], [360, "6 horas"], [720, "12 horas"], [1440, "1 día"]].map(([m, l]) => `<option value="${m}" ${m == S.interval_min ? "selected" : ""}>${l}</option>`).join("")}</select></label></p>
   <div class="row-actions"><button class="btn" id="mnow2">Medir ahora</button><button class="btn warn" id="wipe">Borrar todas las mediciones</button></div>${jobBox("measure")}</div></div>
  <div class="sec"><div><h3>Sistema</h3><p class="d">Linux se actualiza solo cada mes.</p></div>
   <div><p style="margin-top:0">Encendida hace ${(sys.uptime_s / 3600).toFixed(1)} h, CPU a ${sys.cpu_c.toFixed(0)} °C, disco libre ${sys.disk_free_gb.toFixed(0)} de ${sys.disk_total_gb.toFixed(0)} GB. Modelo ${esc(S.model)}: ${S.ollama ? "activo" : "<strong style='color:var(--coral)'>apagado</strong>"}.</p>
   <p class="muted">Última actualización de Linux: ${up ? ago(up.ts, S.now) + (up.ok ? "" : " (con errores)") : "ninguna todavía"}.</p>
   <div class="row-actions"><button class="btn" id="upd">Actualizar Linux ahora</button><button class="btn warn" id="reboot">Reiniciar la Pi</button></div>${jobBox("update")}</div></div>
  <div class="sec"><div><h3>Acceso</h3></div><div><p style="margin-top:0">Dirección pública: ${S.url ? `<a href="${esc(S.url)}">${esc(S.url)}</a>` : "aún sin túnel"}</p><p class="muted">Dirección fija prevista: ${esc(S.domain)}</p></div></div>`;
}

function bind() {
  const on = (s, f) => { const e = $(s); if (e) e.onclick = guard(f); };
  const meas = async () => { await api("/measure", {}); toast("Midiendo…"); poll(); };
  on("#clean", async () => { await api("/clean", {}); toast("Limpiando…"); poll(); });
  on("#mnow", meas); on("#mnow2", meas);
  $("#rng") && ($("#rng").onchange = e => { hist = +e.target.value; render(); });
  $("#login") && ($("#login").onsubmit = guard(async e => { e.preventDefault(); await api("/login", { password: $("#pw").value }); await refresh(); }));
  $("#auto") && ($("#auto").onchange = guard(async e => { await api("/settings", { auto: e.target.checked }, "PUT"); toast(e.target.checked ? "Medición automática activada" : "Medición automática apagada"); await refresh(); }));
  $("#intv") && ($("#intv").onchange = guard(async e => { await api("/settings", { interval_min: +e.target.value }, "PUT"); toast("Guardado"); }));
  document.querySelectorAll("[data-cap]").forEach(b => b.onclick = guard(async () => {
    b.disabled = true; b.textContent = "Midiendo…";
    try { calPts = (await api("/calibrate/ph/capture", { buffer: +b.dataset.cap })).points; } finally { render(); }
  }));
  on("#calok", async () => { const c = await api("/calibrate/ph/commit", {}); calPts = []; toast(c.max_err > .15 ? `Guardado, pero el error es alto (${c.max_err.toFixed(2)} pH): repite con soluciones frescas.` : "Calibración guardada"); await refresh(); });
  on("#calreset", async () => { await api("/calibrate/ph/reset", {}); calPts = []; toast("Calibración borrada"); await refresh(); });
  on("#tcap", async () => { const c = await api("/calibrate/turb/capture", {}); toast(`Agua limpia guardada: ${c.v_clear.toFixed(2)} V`); await refresh(); });
  on("#treset", async () => { await api("/calibrate/turb/reset", {}); toast("Calibración de turbidez borrada"); await refresh(); });
  on("#wipe", async () => { if (confirm("¿Borrar TODAS las mediciones y sus análisis? No se puede deshacer.")) { await api("/measurements", {}, "DELETE"); toast("Mediciones borradas"); await refresh(); } });
  on("#upd", async () => { await api("/system/update", {}); toast("Actualizando…"); poll(); });
  on("#reboot", async () => { if (confirm("¿Reiniciar la Pi? Tardará un par de minutos en volver.")) { await api("/system/reboot", {}); toast("Reiniciando…"); } });
}

async function render() {
  $("#dev").textContent = S.device; $("#mod").textContent = S.ollama ? "Modelo activo" : "Modelo apagado";
  $("#dot").className = S.ollama ? "" : "off"; $("#out").hidden = !S.admin;
  if (S.latest) document.documentElement.style.setProperty("--tint", dropColor(S.latest.score));
  const html = tab === "resumen" ? await renderResumen() : tab === "historial" ? await renderHistorial() : tab === "patrones" ? await renderPatrones() : await renderDispositivo();
  $("#" + tab).innerHTML = html; bind();
}
let pollT;
function poll() { clearTimeout(pollT); pollT = setTimeout(async () => { await refresh(); if (Object.values(S.jobs).some(j => j.state === "running")) poll(); }, 3000); }
refresh().then(() => { if (Object.values(S.jobs).some(j => j.state === "running")) poll(); });
setInterval(() => { if (!document.hidden && tab === "resumen") refresh(); }, 60000);
</script>
</body>
</html>
